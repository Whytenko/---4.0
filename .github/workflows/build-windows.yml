name: build-windows-installer

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Install Tesseract
        run: choco install tesseract --no-progress -y

      - name: Build portable package
        run: python packaging/build_portable.py

      - name: Self-check and smoke test (packaged EXE)
        shell: pwsh
        run: |
          $exe = "dist/AKTNaryadVerifier/AKTNaryadVerifier.exe"
          if (!(Test-Path $exe)) { throw "Missing executable: $exe" }
          $global:LASTEXITCODE = 0
          & $exe --self-check
          if ($LASTEXITCODE -ne 0) { throw "Self-check failed with code $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          & $exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Smoke test failed with code $LASTEXITCODE" }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        run: python packaging/windows/build_installer.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.sha256
            release/*.txt
            packaging/OFFICE_DEPLOY_RU.md
