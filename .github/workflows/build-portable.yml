name: build-portable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress -y

      - name: Build portable package
        run: python packaging/build_portable.py

      - name: Self-check and smoke test (Windows packaged EXE)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist/AKTNaryadVerifier/AKTNaryadVerifier.exe"
          if (!(Test-Path $exe)) { throw "Missing executable: $exe" }
          $global:LASTEXITCODE = 0
          & $exe --self-check
          if ($LASTEXITCODE -ne 0) { throw "Self-check failed with code $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          & $exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Smoke test failed with code $LASTEXITCODE" }

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: python packaging/windows/build_installer.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}
          path: release/*
